<header class="site-header">

    <button class="nav-toggle" id="nav-toggle" aria-label="메뉴 열기"><i class="fa-solid fa-bars"></i></button>
    <nav class="main-nav" id="main-nav"></nav>
    <div class="auth-box"></div>
  </div>
</header>
<main class="section" style="padding-top:28px;">
  <div class="container">
    <div class="section-head">
      <span class="eyebrow">QUIZ</span>
      <h2>🧩 퀴즈</h2>
      <p>개념·빈칸·헷갈림·종합 퀴즈 중 골라 실력을 확인해 보세요.</p>
    </div>
    <div class="quiz-card" id="quiz-setup">
      <div class="filter-bar">
        <select id="qz-type"><option value="concept">개념 확인 퀴즈</option><option value="blank">빈칸 채우기 퀴즈 (실전형)</option><option value="confusing">헷갈리는 표현 퀴즈</option><option value="mixed">종합 퀴즈</option></select>
        <select id="qz-school"><option value="all">전체</option><option value="elementary">🌱 초등</option><option value="middle">🌿 중등</option><option value="high">🌳 고등</option></select>
        <select id="qz-count"><option value="5">5문제</option><option value="10" selected>10문제</option><option value="15">15문제</option></select>
        <select id="qz-time"><option value="0">제한시간 없음</option><option value="60">60초</option><option value="180">3분</option><option value="300">5분</option></select>
      </div>
      <div class="detail-controls"><button class="btn btn-primary" id="qz-start">퀴즈 시작!</button></div>
    </div>
    <div class="quiz-card" id="quiz-play" style="display:none;">
      <div class="progress-dots" id="qz-progress"></div>
      <p id="qz-timer" class="muted" style="display:none;font-weight:800;"></p>
      <p id="qz-question" style="font-size:1.1rem;line-height:1.8;"></p>
      <div id="qz-answers"></div>
      <div class="feedback" id="qz-feedback" style="display:none;"></div>
    </div>
    <div class="quiz-card" id="quiz-result" style="display:none;"></div>
  </div>
</main>
